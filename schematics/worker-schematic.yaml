# worker-schematic.yaml — Image Factory schematic for home-cluster-1 workers.
# Previous worker schematic (c9078f94...) carried siderolabs/iscsi-tools ONLY (Longhorn needs it);
# verified by re-POSTing that content — this schematic adds the low-power kernel args.
# Minted: <POST https://factory.talos.dev/schematics>; content-addressable.
# Installer image: factory.talos.dev/metal-installer/8e594bc9dbab2dce4bfcf4a7248c6c2462dca385c77a4ba3812878373179ba27:<talos-version>
# NOTE: kernel args are baked into the UKI at image build time — changing them here
# requires re-minting this schematic AND upgrading nodes to the new image (apply-config alone is ignored).
# WARNING: never upgrade a worker with the plain ghcr.io/siderolabs/installer — it drops
# the iscsi-tools extension and Longhorn breaks.
customization:
  extraKernelArgs:
    - pcie_aspm=force
    - pcie_aspm.policy=power
  systemExtensions:
    officialExtensions:
      - siderolabs/iscsi-tools