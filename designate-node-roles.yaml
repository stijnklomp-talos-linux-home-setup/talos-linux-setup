#!/usr/bin/env bash

set -euo pipefail

# designate-node-roles.yaml — label + taint nodes by role for home-cluster-1.
# Run after adding/rebuilding ANY worker: general workers get the worker label
# (ingress-nginx/MetalLB/Tekton controllers nodeSelector on it); a CI node gets
# the ci label + NoSchedule taint (only Tekton PipelineRuns run there).
# Roles (cluster facts, see AGENTS.md):
#   control-plane (talos-pve-g5b, 192.168.1.107)  — already tainted by Talos; runs kube-system only
#   ci            (talos-szo-afm, 192.168.1.108)  — Dell; runs Tekton PipelineRuns only
#   worker        (talos-llr-9ky, 192.168.1.106 + talos-9an-o2z, 192.168.1.109) — Lenovo; everything else
# Idempotent; safe to re-run after node re-joins.
# Requires kubectl (default cluster: home-cluster-1-config/, see AGENTS.md).

CI_NODE_IP="${CI_NODE_IP:-192.168.1.108}"
WORKER_NODE_IPS="${WORKER_NODE_IPS:-192.168.1.106 192.168.1.109}"

node_name() { # $1 = IP -> node name
  kubectl get nodes -o json | jq -r --arg ip "$1" '
    .items[] | select(.status.addresses[]?.type == "InternalIP" and .status.addresses[]?.address == $ip) | .metadata.name'
}

ci_node="$(node_name "${CI_NODE_IP}")"
if [[ -z "${ci_node}" ]]; then
  echo "ERROR: CI node ${CI_NODE_IP} not found" >&2
  exit 1
fi

echo "==> Designating ${ci_node} (${CI_NODE_IP}) as CI node ..."
kubectl label node "${ci_node}" node-role.kubernetes.io/ci="" --overwrite
kubectl taint node "${ci_node}" node-role.kubernetes.io/ci:NoSchedule --overwrite

for ip in ${WORKER_NODE_IPS}; do
  node="$(node_name "${ip}")"
  if [[ -z "${node}" ]]; then
    echo "ERROR: worker node ${ip} not found" >&2
    exit 1
  fi
  echo "==> Designating ${node} (${ip}) as worker node ..."
  kubectl label node "${node}" node-role.kubernetes.io/worker="" --overwrite
done

echo
echo "==> Final state:"
kubectl get nodes -o custom-columns='NAME:.metadata.name,ROLES:.metadata.labels.node-role\.kubernetes\.io,TAINTS:.spec.taints[*].key'